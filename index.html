<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>PSXEdge — Smarter Allocation. Simpler Investing.</title>
    <meta
      name="description"
      content="PSXEdge is a lightweight, browser-only investment allocation calculator for the PSX KSE-100 and KMI-30 indices. Instant calculations, Excel export, no backend."
    />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="PSXEdge — Smarter Allocation. Simpler Investing." />
    <meta
      property="og:description"
      content="Allocate a PKR investment across the top-weighted KSE-100 and KMI-30 companies. Instant, private and fully client-side."
    />
    <meta property="og:type" content="website" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('psxedge.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
